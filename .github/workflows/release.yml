# Build Control Room: test, then package for Linux (AppImage) and Windows
# (portable zip). Tag pushes (v*) also publish a GitHub Release carrying
# both artifacts; workflow_dispatch builds artifacts without releasing.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run test suite
        working-directory: apps/desktop
        run: |
          uv sync --extra dev
          uv run pytest

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CurbStream-x86_64.AppImage
          path: packaging/CurbStream-*-x86_64.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            packaging/CurbStream-*-x86_64.AppImage --clobber

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run test suite (POSIX launch tests skip on Windows)
        working-directory: apps/desktop
        run: |
          uv sync --extra dev
          uv run pytest
      - name: Build Windows zip
        shell: pwsh
        run: packaging/windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: videohls-controlroom-windows-x64.zip
          path: packaging/videohls-controlroom-windows-x64.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$env:GITHUB_REF_NAME" `
            packaging/videohls-controlroom-windows-x64.zip --clobber
