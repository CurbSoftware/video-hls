[project]
name = "videohls-controlroom"
version = "0.1.0"
description = "Control Room - desktop GUI for the video-hls pipeline"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
